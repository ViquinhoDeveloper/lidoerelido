<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viquinho System</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo {
      position: relative;
      width: 200px;
      height: 200px;
      border: 4px solid #0f0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.2);
      animation: pulse 2.5s infinite alternate ease-in-out;
    }
    .logo span {
      font-size: 150px;
      font-weight: 300;
      line-height: 0.8;
      color: #0f0;
      user-select: none;
      transform: translateY(-4px);
    }
    .status-area {
      margin-top: 40px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .msg {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      letter-spacing: 2px;
    }
    .msg.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #msg-loading {
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
    }
    #msg-security {
      font-size: 16px;
      font-weight: normal;
      color: #7cfc00;
      letter-spacing: 1.5px;
    }
    #msg-redirect {
      font-size: 15px;
      color: #39ff14;
      font-style: italic;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background-color: #0f0;
      margin-left: 5px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0% {
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.25), inset 0 0 15px rgba(0, 255, 0, 0.15);
      }
      100% {
        box-shadow: 0 0 30px rgba(0, 255, 0, 0.6), inset 0 0 25px rgba(0, 255, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span>V</span>
    </div>

    <div class="status-area">
      <!-- 1. loading... (depois de 2.5s) -->
      <div id="msg-loading" class="msg">loading...</div>

      <!-- 2. checking security... (5s após loading) -->
      <div id="msg-security" class="msg">checking security...</div>

      <!-- 3. redirecting... (3s após checking security) -->
      <div id="msg-redirect" class="msg">redirecting...<span class="cursor"></span></div>
    </div>
  </div>

  <script>
    // Defina o link de redirecionamento aqui:
const REDIRECT_URL = "page.html";
window.location.replace(REDIRECT_URL);


    // 1. Ao entrar na página, após 2.5 segundos (2500ms): mostra "loading..."
    setTimeout(() => {
      document.getElementById('msg-loading').classList.add('visible');

      // 2. Depois de mais 5 segundos (5000ms): mostra "checking security..."
      setTimeout(() => {
        document.getElementById('msg-security').classList.add('visible');

        // 3. Depois de mais 3 segundos (3000ms): mostra "redirecting..."
        setTimeout(() => {
          document.getElementById('msg-redirect').classList.add('visible');

          // 4. Depois de mais 1.5 segundos (1500ms): redireciona
          setTimeout(() => {
            if (REDIRECT_URL && REDIRECT_URL !== "#") {
              window.location.href = REDIRECT_URL;
            } else {
              console.log("Redirecionamento acionado para:", REDIRECT_URL);
            }
          }, 1500);

        }, 3000);

      }, 5000);

    }, 2500);
  </script>
</body>
</html>
