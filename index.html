<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Viquinho System logo</title>
<style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff00;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo {
      position: relative;
      width: 190px;
      height: 190px;
      border: 3.5px solid #00ff00;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.45), inset 0 0 20px rgba(0, 255, 0, 0.3);
      animation: pulse 2.4s infinite alternate ease-in-out;
    }
    .logo span {
      font-size: 135px;
      font-weight: 300;
      line-height: 0.8;
      color: #00ff00;
      user-select: none;
      transform: translateY(-2px);
      text-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
    }
    .status-area {
      margin-top: 45px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .msg {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .msg.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #msg-loading {
      font-size: 18px;
      color: #00ff00;
      letter-spacing: 4px;
    }
    #msg-security {
      font-size: 14px;
      font-weight: normal;
      color: #00ff00;
      letter-spacing: 2.5px;
      opacity: 0;
    }
    #msg-security.visible {
      opacity: 0.85;
    }
    #msg-redirect {
      font-size: 13px;
      font-weight: normal;
      color: #00ff00;
      letter-spacing: 2px;
      font-style: normal;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #00ff00;
      margin-left: 6px;
      vertical-align: middle;
      box-shadow: 0 0 8px #00ff00;
      animation: blink 0.7s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes pulse {
      0% {
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.3), inset 0 0 12px rgba(0, 255, 0, 0.2);
        border-color: #00ff00;
      }
      100% {
        box-shadow: 0 0 35px rgba(0, 255, 0, 0.75), inset 0 0 25px rgba(0, 255, 0, 0.5);
        border-color: #39ff14;
      }
    }
  </style>
</head>
<body>
<div class="container">
<div class="logo">
<span>V</span>
</div>
<div class="status-area">
<!-- 1. LOADING... (surge suavemente aos 2.5s) -->
<div class="msg" id="msg-loading">LOADING...</div>
<!-- 2. CHECKING SECURITY... (surge aos 7.5s no total: +5.0s após loading) -->
<div class="msg" id="msg-security">CHECKING SECURITY...</div>
<!-- 3. REDIRECTING... (surge aos 10.5s no total: +3.0s após security) -->
<div class="msg" id="msg-redirect">REDIRECTING...<span class="cursor"></span></div>
</div>
</div>
<script>
    // =========================================================================
    // CONFIGURAÇÃO DE DESTINO:
    // Altere a URL abaixo para o destino desejado (ex.: plataforma Lido e Relido)
    // =========================================================================
    const REDIRECT_URL = "https://www.google.com";

    // Cronograma rigoroso com base no carregamento da página:
    // T = 0.0s  -> Carrega página com o logo 'V' pulsando em neon verde (#00ff00)
    // T = 2.5s  -> Exibe "LOADING..."
    // T = 7.5s  -> (+5.0s) Exibe "CHECKING SECURITY..."
    // T = 10.5s -> (+3.0s) Exibe "REDIRECTING..." com cursor piscante
    // T = 12.0s -> (+1.5s) Executa o redirecionamento final com segurança

    const TIME_LOADING   = 2500;  // 2.5s
    const TIME_SECURITY  = 7500;  // 2.5s + 5.0s = 7.5s total
    const TIME_REDIRECT  = 10500; // 7.5s + 3.0s = 10.5s total
    const TIME_EXECUTE   = 12000; // 10.5s + 1.5s = 12.0s total

    window.addEventListener('DOMContentLoaded', () => {
      // 1. Aos 2.5s: Exibe "LOADING..."
      setTimeout(() => {
        const loadingEl = document.getElementById('msg-loading');
        if (loadingEl) loadingEl.classList.add('visible');
      }, TIME_LOADING);

      // 2. Aos 7.5s (após mais 5.0s): Exibe "CHECKING SECURITY..."
      setTimeout(() => {
        const securityEl = document.getElementById('msg-security');
        if (securityEl) securityEl.classList.add('visible');
      }, TIME_SECURITY);

      // 3. Aos 10.5s (após mais 3.0s): Exibe "REDIRECTING..."
      setTimeout(() => {
        const redirectEl = document.getElementById('msg-redirect');
        if (redirectEl) redirectEl.classList.add('visible');
      }, TIME_REDIRECT);

      // 4. Aos 12.0s (após mais 1.5s): Efetua o redirecionamento
      setTimeout(() => {
        if (REDIRECT_URL && REDIRECT_URL !== "#" && REDIRECT_URL.trim() !== "") {
          window.location.href = REDIRECT_URL;
        } else {
          console.log("[Viquinho System] Redirecionamento simulado para:", REDIRECT_URL);
        }
      }, TIME_EXECUTE);
    });
  </script>
</body></html>
